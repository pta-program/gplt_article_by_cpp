<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GPLT 天梯赛 C++ 语言实现题解库">
  <title>GPLT · C++ 题解库</title>
  <script>
    // 在 Docsify 加载前应用主题，避免刷新时闪现亮色页面。
    (function () {
      try {
        var saved = localStorage.getItem('gplt-theme');
        var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    }());

    // Mermaid 图由题解 Markdown 动态生成。限制单页并发、源码规模和过期路由，
    // 避免快速切页或异常大图造成 SVG/布局对象长期堆积。
    var MERMAID_MAX_DIAGRAMS_PER_PAGE = 4;
    var MERMAID_MAX_SOURCE_CHARS = 6000;
    var MERMAID_MAX_SOURCE_LINES = 120;
    var MERMAID_MAX_NODES = 80;
    var MERMAID_MAX_EDGES = 120;
    var MERMAID_MAX_SVG_CHARS = 200000;
    var mermaidPending = [];
    var mermaidRendering = false;
    window.__mermaidRouteVersion = 0;
    window.__mermaidPageDiagramCount = 0;

    function mermaidLimitError(message) {
      return '<div class="mermaid-render-error">流程图未渲染：' + message + '</div>';
    }

    function mermaidComplexity(code) {
      var nodeMatches = code.match(/(?:^|\s)([A-Za-z][A-Za-z0-9_]*)\s*(?=\[|\(|\{)/gm) || [];
      var edgeMatches = code.match(/-->|---|==>|-.->|~~~|--x|--o/g) || [];
      return {
        chars: code.length,
        lines: code.split(/\r?\n/).length,
        nodes: nodeMatches.length,
        edges: edgeMatches.length
      };
    }

    function drainMermaidQueue() {
      if (mermaidRendering || !mermaidPending.length) return;
      var task = mermaidPending.shift();
      if (task.routeVersion !== window.__mermaidRouteVersion) {
        drainMermaidQueue();
        return;
      }

      mermaidRendering = true;
      Promise.resolve().then(task.render).then(task.success).catch(task.failure).then(function () {
        mermaidRendering = false;
        drainMermaidQueue();
      }, function () {
        mermaidRendering = false;
        drainMermaidQueue();
      });
    }

    function enqueueMermaidRender(task) {
      mermaidPending.push(task);
      drainMermaidQueue();
    }

    window.$docsify = {
      name: 'GPLT · C++ 题解库',
      repo: 'https://github.com/Zonkidd-Shao/gplt_article_by_cpp',
      loadSidebar: true,
      homepage: 'README.md',
      relativePath: false,
      mergeNavbar: true,
      // 题目之间保持同级；题目内目录由插件平铺插入当前题目。
      subMaxLevel: 0,
      sidebarDisplayLevel: 2,
      auto2top: true,
      search: {
        paths: 'auto',
        placeholder: '搜索题号或关键词',
        noData: '没有找到匹配内容',
        depth: 4,
        hideOtherSidebarContent: false
      },
      pagination: {
        previousText: '上一题',
        nextText: '下一题',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: '复制代码',
        errorText: '复制失败',
        successText: '已复制'
      },
      themeColor: '#6d5dfc',
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      plugins: [function (hook, vm) {
        hook.beforeEach(function (markdown) {
          window.__mermaidRouteVersion += 1;
          window.__mermaidPageDiagramCount = 0;
          mermaidPending.length = 0;
          return markdown;
        });

        hook.doneEach(function () {
          document.querySelectorAll('.sidebar-nav .page-toc').forEach(function (toc) {
            toc.remove();
          });

          var activeLink = document.querySelector('.sidebar-nav li.active > a, .sidebar-nav li.active > p > a');
          if (!activeLink) return;
          var activeItem = activeLink.closest('li');
          // 将当前页面的全部标题同步到左侧目录，避免题解中的小节无法跳转。
          var headings = Array.prototype.slice.call(document.querySelectorAll(
            '#main h1, #main h2, #main h3, #main h4, #main h5, #main h6'
          ));
          if (!headings.length) return;

          var toc = document.createElement('ul');
          toc.className = 'app-sub-sidebar page-toc';
          headings.forEach(function (heading) {
            var item = document.createElement('li');
            var link = document.createElement('a');
            link.className = 'section-link';
            item.dataset.level = heading.tagName.substring(1);
            link.textContent = heading.textContent;
            link.href = vm.router.toURL(vm.router.getCurrentPath(), { id: heading.id });
            item.appendChild(link);
            toc.appendChild(item);
          });
          activeItem.appendChild(toc);
        });
      }],
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang !== 'mermaid') return this.origin.code.apply(this, arguments);
            var complexity = mermaidComplexity(code);
            if (complexity.chars > MERMAID_MAX_SOURCE_CHARS ||
                complexity.lines > MERMAID_MAX_SOURCE_LINES ||
                complexity.nodes > MERMAID_MAX_NODES ||
                complexity.edges > MERMAID_MAX_EDGES) {
              return mermaidLimitError('图规模超过安全上限（节点 ' + complexity.nodes +
                '，连线 ' + complexity.edges + '，源码 ' + complexity.chars + ' 字符）');
            }
            if (window.__mermaidPageDiagramCount >= MERMAID_MAX_DIAGRAMS_PER_PAGE) {
              return mermaidLimitError('单页流程图数量超过安全上限');
            }
            window.__mermaidPageDiagramCount += 1;
            var id = 'mermaid-' + (++window.__mermaidCounter);
            var containerId = id + '-container';
            var routeVersion = window.__mermaidRouteVersion;
            enqueueMermaidRender({
              routeVersion: routeVersion,
              render: function () {
                if (routeVersion !== window.__mermaidRouteVersion) return null;
                return Promise.resolve(window.mermaid.render(id, code));
              },
              success: function (result) {
                if (!result || routeVersion !== window.__mermaidRouteVersion) return;
                if (result.svg.length > MERMAID_MAX_SVG_CHARS) {
                  throw new Error('生成的 SVG 过大');
                }
                var container = document.getElementById(containerId);
                if (container) container.innerHTML = result.svg;
              },
              failure: function (error) {
                var container = document.getElementById(containerId);
                if (container && routeVersion === window.__mermaidRouteVersion) {
                  container.className = 'mermaid-render-error';
                  container.textContent = '流程图渲染失败：' + (error && error.message ? error.message : 'Mermaid 语法错误');
                }
                console.error('Mermaid render failed', error);
              }
            });
            return '<div class="mermaid" id="' + containerId + '"></div>';
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换暗黑模式" title="切换暗黑模式">
    <span class="theme-toggle__icon" aria-hidden="true">☾</span>
    <span class="theme-toggle__text">暗黑模式</span>
  </button>

  <div id="app">正在加载题解库…</div>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    window.__mermaidCounter = 0;
    mermaid.initialize({
      startOnLoad: false,
      theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'default'
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-count/dist/countable.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
